name: Update Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: GitHub Activity Graph
        uses: ashutosh00710/github-readme-activity-graph@main
        with:
          REPOSITORY: ${{ github.repository }}
          OUTPUT_PATH: ./github-metrics.svg
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'GitHub Activity Graph'
          file_pattern: './github-metrics.svg'
