name: Update Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"  # Executa diariamente à meia-noite (UTC)
  workflow_dispatch:     # Permite execução manual via Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Permissão necessária para fazer commit

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🎯 Generate GitHub Activity Graph
        uses: ashutosh00710/github-readme-activity-graph@main
        with:
          REPOSITORY: ${{ github.repository }}
          OUTPUT_PATH: ./github-metrics.svg
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🔄 chore: update activity graph'
          file_pattern: './github-metrics.svg'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          skip_dirty_check: false
          status_options: '--porcelain'
